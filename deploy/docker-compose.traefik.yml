# TunTransport backend on a VPS that already runs Traefik (no Caddy, no published ports).
# Traefik routes and certifies api.<domain> (API) and <domain> / www (site) through labels.
# Select this file with COMPOSE_FILE=docker-compose.traefik.yml in .env, then `docker compose up -d --build`.
name: tuntransport

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - ./backups:/backups
    networks: [internal]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ../backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      DB_NAME: tuntransport
      NETWORK_FILE: /app/data/network.json
      ADMIN_TOKEN: ${ADMIN_TOKEN}
    volumes:
      - ./data:/app/data:ro
    networks: [internal, traefik]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK}
      - traefik.http.routers.tt-api.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.tt-api.entrypoints=${TRAEFIK_ENTRYPOINT}
      - traefik.http.routers.tt-api.tls=true
      - traefik.http.routers.tt-api.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.routers.tt-api.middlewares=tt-headers,tt-body-limit
      - traefik.http.services.tt-api.loadbalancer.server.port=8001
      - traefik.http.middlewares.tt-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.tt-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.tt-body-limit.buffering.maxRequestBodyBytes=65536

  site:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./site-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [traefik]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK}
      - traefik.http.routers.tt-site.rule=Host(`${SITE_DOMAIN}`) || Host(`www.${SITE_DOMAIN}`)
      - traefik.http.routers.tt-site.entrypoints=${TRAEFIK_ENTRYPOINT}
      - traefik.http.routers.tt-site.tls=true
      - traefik.http.routers.tt-site.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.routers.tt-site.middlewares=tt-headers
      - traefik.http.services.tt-site.loadbalancer.server.port=80

networks:
  # MongoDB only lives here: never reachable from Traefik or the Internet.
  internal:
  # The network your Traefik container is attached to (see `docker network ls`).
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK}

volumes:
  mongo-data:
