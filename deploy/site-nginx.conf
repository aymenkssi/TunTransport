# Static site behind Traefik (TLS is handled by Traefik): /privacy serves privacy.html.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
