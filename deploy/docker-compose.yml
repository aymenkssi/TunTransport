# TunTransport backend on a VPS: API (FastAPI) + MongoDB + Caddy (automatic HTTPS).
# Usage: cp .env.example .env && edit it, then `docker compose up -d --build`.
# Server that already runs Traefik: use docker-compose.traefik.yml instead (see README).
name: tuntransport

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - ./backups:/backups
    # No published port: MongoDB is only reachable from the API container.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ../backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      DB_NAME: tuntransport
      NETWORK_FILE: /app/data/network.json
      PLACES_FILE: /app/data/places.json
      # Car and walking routes: public FOSSGIS servers unless a self-hosted OSRM is configured.
      OSRM_CAR_URL: ${OSRM_CAR_URL:-https://routing.openstreetmap.de/routed-car}
      OSRM_FOOT_URL: ${OSRM_FOOT_URL:-https://routing.openstreetmap.de/routed-foot}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
    volumes:
      # Lines, stops, shapes and timetables generated by tools/import_tunismapper.py (see README).
      - ./data:/app/data:ro

  # Optional (COMPOSE_PROFILES=osrm, after ./setup-osrm.sh): self-hosted car and walking routes.
  osrm-car:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles: ["osrm"]
    restart: unless-stopped
    command: osrm-routed --algorithm mld /data/tunisia.osrm
    volumes:
      - ./osrm/car:/data:ro
  osrm-foot:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles: ["osrm"]
    restart: unless-stopped
    command: osrm-routed --algorithm mld /data/tunisia.osrm
    volumes:
      - ./osrm/foot:/data:ro

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  mongo-data:
  caddy-data:
  caddy-config:
